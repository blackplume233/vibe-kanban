name: Create GitHub Pre-Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: Version bump
        required: true
        type: choice
        default: patch
        options: [patch, minor, major, prerelease]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 22
  RUST_TOOLCHAIN: nightly-2026-08-01
  SQLX_OFFLINE: true

jobs:
  bump-version:
    if: github.ref_type == 'branch'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/cache-cargo-install-action@34ce5120836e5f9f1508d8713d7fdea0e8facd6f # v3.0.1
        with:
          tool: cargo-edit
          git: https://github.com/killercup/cargo-edit
          rev: 96a3879fe3bafda6d0f943b642997fbf03e235cd # v0.13.9
      - name: Bump version and push release tag
        id: bump
        env:
          VERSION_TYPE: ${{ inputs.version_type }}
        run: |
          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config --local user.name 'github-actions[bot]'
          bash ./bump-version.sh "--$VERSION_TYPE"
          tag=$(git describe --exact-match --tags HEAD)
          git push --atomic origin "HEAD:$GITHUB_REF" "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  nsh:
    needs: bump-version
    strategy:
      matrix:
        include:
          - target: web
            os: ubuntu-24.04
            path: target/package-web/vibe-own/
          - target: windows
            os: windows-2025
            path: target/package-windows/vibe-own.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.bump-version.outputs.tag }}
      - uses: ./.github/actions/setup-nsh
        with:
          target: ${{ matrix.target }}
      - run: node scripts/nsh.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v6
        with:
          name: nsh-${{ matrix.target }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  build-backend:
    needs: bump-version
    strategy:
      matrix:
        include:
          - {name: linux-x64, target: x86_64-unknown-linux-musl, os: ubuntu-24.04, command: zigbuild}
          - {name: linux-arm64, target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, command: zigbuild}
          - {name: macos-x64, target: x86_64-apple-darwin, os: macos-15-intel, command: build}
          - {name: macos-arm64, target: aarch64-apple-darwin, os: macos-15, command: build}
          - {name: windows-x64, target: x86_64-pc-windows-msvc, os: windows-2025, command: build, ext: .exe}
          - {name: windows-arm64, target: aarch64-pc-windows-msvc, os: ubuntu-24.04, command: 'xwin build --cross-compiler clang-cl', ext: .exe}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.bump-version.outputs.tag }}
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release-${{ matrix.target }}
      - name: Install compiler dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev lld llvm nasm cmake ninja-build
      - name: Configure Visual Studio LLVM
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $llvm = Join-Path (& $vswhere -latest -property installationPath) 'VC\Tools\Llvm\x64\bin'
          "LIBCLANG_PATH=$llvm" >> $env:GITHUB_ENV
      - uses: BloopAI/setup-zig@main
        if: matrix.command == 'zigbuild'
        with:
          version: 0.15.2
      - name: Install Linux cross-build tool
        if: matrix.command == 'zigbuild'
        run: cargo install --locked cargo-zigbuild --version 0.23.4
      - name: Install Windows ARM64 cross-build tool
        if: matrix.name == 'windows-arm64'
        run: |
          sudo apt-get install -y clang-19 clang-tools-19 llvm-19 lld-19
          echo /usr/lib/llvm-19/bin >> "$GITHUB_PATH"
          cargo install --locked cargo-xwin --version 0.23.1
      - name: Build standalone binaries
        shell: bash
        env:
          PLATFORM: ${{ matrix.name }}
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
        run: |
          if [[ "$PLATFORM" == windows-* ]]; then
            export CARGO_PROFILE_RELEASE_DEBUG=0
          fi
          if [[ "$PLATFORM" == windows-arm64 ]]; then
            chmod +x scripts/ring-cc-wrapper.sh scripts/clang
            export PATH="$PWD/scripts:$PATH"
            export RING_CC=/usr/lib/llvm-19/bin/clang
            export DEFAULT_CC=clang-cl
            export CC_aarch64_pc_windows_msvc="$PWD/scripts/ring-cc-wrapper.sh"
          fi
          cargo ${{ matrix.command }} --locked --release --target "$TARGET" -p server -p mcp -p review \
            --bin server --bin vibe-kanban-mcp --bin review
          mkdir -p dist
          cp "target/$TARGET/release/server$EXT" "dist/vibe-kanban$EXT"
          cp "target/$TARGET/release/vibe-kanban-mcp$EXT" "dist/vibe-kanban-mcp$EXT"
          cp "target/$TARGET/release/review$EXT" "dist/vibe-kanban-review$EXT"
      - uses: actions/upload-artifact@v6
        with:
          name: backend-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  create-prerelease:
    permissions:
      contents: write
    needs: [bump-version, nsh, build-backend]
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.bump-version.outputs.tag }}
      RELEASE_BASE: ${{ github.server_url }}/${{ github.repository }}/releases/download
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.bump-version.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v7
        with:
          path: artifacts/
      - name: Assemble release assets
        run: |
          for dir in artifacts/backend-*; do
            platform=${dir##*/backend-}
            chmod +x "$dir"/*
            python3 scripts/release/package-assets.py platform "$platform" "$dir" artifacts/nsh-web release
          done
          python3 scripts/release/package-assets.py native artifacts/nsh-windows/vibe-own.zip release
          python3 scripts/release/package-assets.py web artifacts/nsh-web release/vibe-own-web.zip
          python3 scripts/release/package-assets.py manifest release "$TAG"
          npm --prefix npx-cli ci
          npm --prefix npx-cli run build
          node scripts/release/stage-npm.mjs npm-stage "$TAG" "$RELEASE_BASE"
          (cd npm-stage && npm pack --pack-destination ../release)
      - uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          tag_name: ${{ needs.bump-version.outputs.tag }}
          name: Pre-release ${{ needs.bump-version.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
