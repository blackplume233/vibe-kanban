name: Test

on:
  pull_request:
    branches: [main, my/main]
  push:
    branches: [main, my/main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/my/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: 22
  PNPM_VERSION: 10.13.1
  RUST_TOOLCHAIN: nightly-2026-08-01

jobs:
  backend-schema-checks:
    runs-on: ubuntu-24.04
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/cargo-checks-common-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache-key: backend-schema-checks
          setup-node: 'true'
          setup-sqlx-cli: 'true'
      - run: pnpm run generate-types:check
      - run: pnpm run prepare-db:check

  backend-clippy:
    runs-on: ubuntu-24.04
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      SQLX_OFFLINE: true
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/cargo-checks-common-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          cache-key: backend-clippy
      - run: cargo metadata --locked --format-version 1 > /dev/null
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets --features qa-mode -- -D warnings

  backend-test:
    runs-on: ubuntu-24.04
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      SQLX_OFFLINE: true
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/cargo-checks-common-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache-key: backend-test
      - name: Install cargo-nextest
        uses: taiki-e/cache-cargo-install-action@34ce5120836e5f9f1508d8713d7fdea0e8facd6f # v3.0.1
        with:
          tool: cargo-nextest
          git: https://github.com/nextest-rs/nextest
          rev: 6e4a9d6f2c4964f30ff54a8cd5466f8869267daa # cargo-nextest-0.9.132
      - run: cargo nextest run --locked --workspace

  nsh:
    strategy:
      matrix:
        include:
          - target: web
            os: ubuntu-24.04
            cargo-args: --target wasm32-unknown-unknown
          - target: windows
            os: windows-2025
            cargo-args: ''
    runs-on: ${{ matrix.os }}
    env:
      SQLX_OFFLINE: true
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nsh
        with:
          target: ${{ matrix.target }}
      - run: cargo fmt --manifest-path crates/nsh-app/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path crates/nsh-app/Cargo.toml ${{ matrix.cargo-args }} -- -D warnings
      - run: node scripts/nsh.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v6
        with:
          name: nsh-${{ matrix.target }}
          path: target/package-${{ matrix.target }}/
          if-no-files-found: error

  npm-launcher:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
        working-directory: npx-cli
      - run: npm run build
        working-directory: npx-cli
      - run: node npx-cli/bin/cli.js --help
