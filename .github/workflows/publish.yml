name: Publish to npm

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag_name:
        description: GitHub Release tag
        required: true
        type: string

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # npm trusted publishing

env:
  # 22.22.2 broke upgrading npm; keep a working patch for npm OIDC.
  NODE_VERSION: 22.22.1

jobs:
  publish:
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease)
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag_name }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.12.0
      - name: Download and publish the exact release tarball
        run: |
          dir="$RUNNER_TEMP/npm-release"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'vibe-kanban-*.tgz' --dir "$dir"
          shopt -s nullglob
          files=("$dir"/*.tgz)
          [[ ${#files[@]} -eq 1 ]]
          package="${files[0]}"
          version=$(tar -xOzf "$package" package/package.json | jq -er '.version')
          [[ "$TAG" == "v$version" || "$TAG" == "v$version."* || "$TAG" == "v$version-"* ]]
          # The local release command may already have published this tarball under next.
          if existing=$(npm view "vibe-kanban@$version" dist.integrity --json); then
            expected="sha512-$(openssl dgst -sha512 -binary "$package" | openssl base64 -A)"
            [[ "$(jq -r . <<<"$existing")" == "$expected" ]]
          else
            npm publish "$package" --provenance --access public
          fi
